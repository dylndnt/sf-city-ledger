name: Refresh and deploy FY2025 actuals

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actuals-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/model.test.mjs
      - id: refresh
        name: Fetch and validate city data
        run: python -m scripts.refresh_data
        continue-on-error: true
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-snapshot
          path: build/source/
          if-no-files-found: ignore
      - name: Commit validated data if changed
        if: steps.refresh.outcome == 'success'
        run: |
          if ! git diff --quiet -- public/data/fy2025.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/fy2025.json
            git commit -m 'data: refresh FY2025 actuals'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag failed data refresh
        if: steps.refresh.outcome != 'success'
        run: exit 1
